<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="SoundBlend">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#ff2e57"/>
      <stop offset="0.55" stop-color="#ff0f4d"/>
      <stop offset="1" stop-color="#c40039"/>
    </radialGradient>
    <radialGradient id="shine" cx="0.34" cy="0.24" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- le fond : le noir de l'app -->
  <rect width="512" height="512" fill="#0a0a0a"/>
  <rect width="512" height="512" fill="#3a0012" opacity="0.55"/>
  <circle cx="256" cy="268" r="330" fill="url(#glow)" opacity="0.42"/>
  <circle cx="256" cy="256" r="256" fill="url(#shine)"/>

  <!-- la marque : trois barres, la troisième à l'accent -->
  <g transform="translate(256 262)">
    <rect x="-70" y="-98" width="32" height="196" rx="16" fill="#ffffff"/>
    <rect x="-19" y="-62" width="32" height="124" rx="16" fill="#ffffff"/>
    <rect x="32" y="-84" width="32" height="168" rx="16" fill="#ff2e57"/>
  </g>
</svg>
