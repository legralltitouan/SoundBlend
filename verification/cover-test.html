<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Test des pochettes</title></head><body><div id="root"></div>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import { useCover, Art } from '/src/components/ui/Art.tsx';
const root = createRoot(document.getElementById('root'));
function Probe({name, track, large}) {
  const cover = useCover(track, large);
  return React.createElement('section', {'data-probe':name},
    React.createElement('output', {'data-url':cover.url, 'data-small':cover.small, 'data-large':cover.large}),
    React.createElement(Art, {track, large, size:100, alt:name}));

window.testCovers = configs => root.render(React.createElement(React.Fragment, null,
  configs.map(c => React.createElement(Probe, {...c, key:c.name}))));
window.testCovers([]);
</script></body></html>
