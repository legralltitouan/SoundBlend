# ═══════════════════════════════════════════════════════════════
# Mise en ligne sur GitHub Pages.
#
# À chaque envoi sur main, GitHub installe, compile et publie le site.
# Aucun PC à laisser allumé, aucun PowerShell : c'est GitHub qui exécute.
#
# Le sous-dossier est calculé tout seul : un dépôt nommé « mon-site »
# est servi sous /mon-site/, un dépôt nommé « <compte>.github.io » à la
# racine. C'est ce que `BASE_PATH` transmet à Vite.
# ═══════════════════════════════════════════════════════════════

name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:      # permet aussi de lancer à la main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # On garde la main sur la compilation : GitHub Pages cache le site
      # pendant un an, or chaque nouvelle version porte de nouveaux noms
      # de fichiers. Ce fichier lui indique de ne pas ajouter ce cache.
      - name: Éviter le cache long de GitHub Pages
        run: touch soundblend-app/public/.nojekyll

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: soundblend-app/package-lock.json

      - name: Installer les dépendances
        working-directory: soundblend-app
        run: npm ci

      - name: Compiler pour le bon sous-dossier
        working-directory: soundblend-app
        run: |
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            BASE="/"
          else
            BASE="/${{ github.event.repository.name }}/"
          fi
          echo "Compilation pour $BASE"
          BASE_PATH="$BASE" npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: soundblend-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
