name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Éviter le cache long de GitHub Pages
        run: mkdir -p public && touch public/.nojekyll

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Compiler pour le bon sous-dossier
        run: |
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            BASE="/"
          else
            BASE="/${{ github.event.repository.name }}/"
          fi
          echo "Compilation pour $BASE"
          BASE_PATH="$BASE" npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
